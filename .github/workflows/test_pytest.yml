name: Test Pytest

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel

env:
  # A PR to main or a push to main (the release) uses PyPI versions only; devel uses the
  # devel branches from [tool.uv.sources].
  UV_NO_SOURCES: ${{ (github.base_ref || github.ref_name) == 'main' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    # a run without the compiled kernels takes an hour: stop it instead of waiting
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project
        run: uv sync --extra test

      # The Pyccel kernels link against libpython without recording where it is. The Pythons that
      # uv downloads (3.10, 3.11, 3.13 here; 3.12 is the runner's own, in /usr/lib) keep it in
      # their own lib/ directory, so the kernels fail to load there ("libpython3.11.so.1.0:
      # cannot open shared object file") and the tests fall back to slow implementations.
      - name: Let the compiled kernels find libpython
        run: |
          libdir="$(uv run python -c 'import sys; print(sys.base_prefix + "/lib")')"
          ls "$libdir" | grep -i libpython || true
          echo "LD_LIBRARY_PATH=$libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      # the Pyccel kernels, compiled on first use, keyed on their sources
      - name: Cache compiled kernels
        uses: actions/cache@v6
        with:
          path: ~/.cache/tree-d-3d/kernels
          key: tree-d-3d-kernels-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('src/tree_d_3d/kernels/*/*_pyccel.py') }}
          restore-keys: tree-d-3d-kernels-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term .

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: false

  # PyPI rejects a release whose metadata has a direct reference (name @ git+...), so a pull
  # request to main fails here instead of the release after the merge.
  no-direct-references:
    if: (github.base_ref || github.ref_name) == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Check that the wheel has no direct references (name @ git+...)
        run: |
          uv build --wheel -o dist
          if unzip -p dist/*.whl '*.dist-info/METADATA' | grep -E '^Requires-Dist: [^;]*@'; then
            echo "::error::Requires-Dist has a direct reference; use a version range and [tool.uv.sources]"
            exit 1
          fi
