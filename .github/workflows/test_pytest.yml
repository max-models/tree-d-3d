name: Test Pytest

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project
        run: uv sync --extra test

      # the Pyccel kernels, compiled on first use, keyed on their sources
      - name: Cache compiled kernels
        uses: actions/cache@v4
        with:
          path: ~/.cache/tree-d-3d/kernels
          key: tree-d-3d-kernels-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('src/tree_d_3d/kernels/*/*_pyccel.py') }}
          restore-keys: tree-d-3d-kernels-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term .

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: false
