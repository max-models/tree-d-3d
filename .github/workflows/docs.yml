name: Docs

# The Astro + Starlight site in docs/: hand-written pages, the executed notebooks and the API
# reference. Built on every push and pull request with the shared workflow of
# max-models/starlight-theme; deployed to GitHub Pages from devel.

on:
  push:
    branches: ["main", "devel"]
  pull_request:
    branches: ["main", "devel"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: max-models/starlight-theme/.github/workflows/docs.yml@v0.1.0
    with:
      pre-build: |
        uv run python docs/tools/examples.py run --python "$(pwd)/.venv/bin/python"
        uv run python docs/tools/examples.py convert --strict
      smoke-paths: |
        getting-started/installation/index.html
        tutorials/fields-and-simulation/index.html
        examples/conserving-tree-code/index.html
        api/tree_d_3d/index.html
        api/tree_d_3d/simulation/index.html
