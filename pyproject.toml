[build-system]
build-backend = "setuptools.build_meta"

requires = [ "setuptools", "wheel" ]

[project]
name = "tree-d-3d"
version = "0.1.0"
description = "Barnes-Hut trees and fast multipole methods for charged particles in a plane, on NumPy, CuPy or Metal."
readme = "README.md"
keywords = [ "barnes-hut", "cupy", "electrostatics", "fast multipole method", "fmm", "n-body", "plasma", "pyccel", "quadtree" ]
license = { file = "LICENSE.txt" }
authors = [ { name = "Max" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "cunumpy>=0.7.1",
  "numpy",
  "pyccel>2.0",
  "scipy",
  "scope-profiler>=0.7.5",
  "simgeometry>=0.1.0",
]

optional-dependencies.dev = [
  "jupyterlab",
  "pre-commit",
  "pyproject-fmt",
  "pyright",
  "ruff",
  "tree-d-3d[test,docs,examples]",
]
optional-dependencies.examples = [
  "plasma-plots[plotly]",
  "plasmacoll>=0.2.0",
]
optional-dependencies.docs = [
  "griffe",
  "ipykernel",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "tree-d-3d[examples]",
]
optional-dependencies.gpu = [ "cupy-cuda12x" ]
optional-dependencies.metal = [ "mlx; sys_platform == 'darwin' and platform_machine == 'arm64'" ]
optional-dependencies.test = [ "pytest", "pytest-cov", "tree-d-3d[examples]" ]
urls."Source" = "https://github.com/max-models/tree-d-3d"

[tool.setuptools.packages.find]
where = [ "src" ]

[tool.setuptools.package-data]
"*" = [ "*.cu", "*.cuh", "py.typed" ]  # CUDA sources are compiled at run time

[tool.ruff]
target-version = "py310"
line-length = 88
extend-include = [ "*.ipynb" ]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear and pydocstyle
select = [ "B", "D", "E", "F", "I", "UP", "W" ]
# E501: the formatter handles line length. B905: zip() over equal-length arrays.
# D102, D107, D417: short methods and constructors documented on the class.
ignore = [ "B905", "D102", "D105", "D107", "D417", "E501" ]
pydocstyle.convention = "google"
per-file-ignores."**/tests/**" = [ "D", "E402" ]
per-file-ignores."*.ipynb" = [ "D" ]
per-file-ignores."docs/tools/*" = [ "D" ]
# kernel bodies follow the Pyccel/CUDA argument lists, not docstring conventions
per-file-ignores."src/tree_d_3d/kernels/*/*" = [ "D", "E741" ]
# research study scripts, kept as run (see the Obsidian note on rational far fields)
per-file-ignores."benchmarks/rational_far_field*.py" = [ "B023", "D", "E702", "E731", "UP034" ]

[tool.pyright]
include = [ "src" ]
venvPath = "."
venv = ".venv"
# the Pyccel kernels use Pyccel annotations (float[:], int64)
exclude = [ "**/tests", "src/tree_d_3d/kernels/*/*_pyccel.py" ]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
pythonpath = [ "src" ]
testpaths = [ "src" ]
addopts = "-ra"

[tool.coverage.run]
source = [ "tree_d_3d" ]
omit = [ "*/tests/*" ]

[tool.coverage.report]
show_missing = true

# PRs to devel test against the devel branches of the max-models packages (pinned in
# uv.lock); PRs to main and the release use PyPI only (CI sets UV_NO_SOURCES).
[tool.uv.sources]
cunumpy = { git = "https://github.com/max-models/cunumpy", branch = "devel" }
plasma-plots = { git = "https://github.com/max-models/plasma-plots", branch = "devel" }
plasmacoll = { git = "https://github.com/max-models/plasmacoll", branch = "devel" }
scope-profiler = { git = "https://github.com/max-models/scope-profiler", branch = "devel" }
simgeometry = { git = "https://github.com/max-models/simgeometry", branch = "devel" }
